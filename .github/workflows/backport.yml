name: Backport carry PRs (label `backport` → instant copy PR onto the patch lane)

on:
  # Owner flow: apply the `backport` label to ANY OPEN fix PR (merging it into
  # master later is independent — some fixes are temporary and never reach
  # master). Instantly a CARRY PR appears: the PR's own commits cherry-picked
  # onto the current patch lane `bugfix-v<latest-tag>` (cut from the tag if the
  # lane does not exist yet). Conflicts never disappear: they stay visible
  # inside the carry PR / the receipt until a human resolves them.
  pull_request:
    types: [labeled]
  # Repair / manual path (re-run after a token hiccup, or backport something
  # that predates the bot). Reads live PR state through the API, so it also
  # works for already-merged PRs.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to (re)carry"
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  carry:
    runs-on: ubuntu-latest
    concurrency:
      group: backport-carry-${{ github.event.pull_request.number || github.event.inputs.pr || 'dispatch' }}
      cancel-in-progress: false
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      # No github.event.pull_request.* context here: it is EMPTY on
      # workflow_dispatch and would silently disable the fork/lane-base gates;
      # the gate step reads all PR facts live from the API.
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr || '' }}
    steps:
      - name: Resolve the source PR
        run: |
          set -uo pipefail
          if [ -z "$PR_NUMBER" ]; then
            echo "::notice::no pull_request/labeled event and no pr input — nothing to do"
            exit 0
          fi
          echo "source PR: #$PR_NUMBER"

      - name: Read the source PR
        id: gate
        if: env.PR_NUMBER != ''
        run: |
          set -euo pipefail
          gh api repos/"$GITHUB_REPOSITORY"/pulls/"$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          TITLE="$(jq -r '.title' "$RUNNER_TEMP/pr.json")"
          HAS_LABEL="$(jq -r '[.labels[]?.name] | contains(["backport"])' "$RUNNER_TEMP/pr.json")"
          echo "title=$TITLE labeled=$HAS_LABEL"
          if [ "$HAS_LABEL" != "true" ]; then
            echo "::notice::PR #$PR_NUMBER does not carry the 'backport' label — ignoring"
            exit 0
          fi
          LIVE_BASE="$(jq -r '.base.ref' "$RUNNER_TEMP/pr.json")"
          LIVE_HEAD_REPO="$(jq -r '.head.repo.full_name' "$RUNNER_TEMP/pr.json")"
          case "$LIVE_BASE" in
            bugfix-v*) echo "::notice::PR #$PR_NUMBER targets the patch lane itself — nothing to carry"; exit 0 ;;
          esac
          if [ "$LIVE_HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            {
              echo "(ai: zai/glm-5.3) **backport carry**: the head lives in a FORK — this bot only carries same-repo branches. Carry it by hand:"
              echo
              echo '```bash'
              echo "LANE=\$(git ls-remote --heads origin 'bugfix-v*' | awk '{print \$NF}' | sed 's|refs/heads/||' | sort -V | tail -1)"
              echo "git checkout -b <fix-branch> origin/\$LANE && git pull"
              echo "git cherry-pick -x <the commit shas of this PR>"
              echo "git push origin HEAD:<fix-branch>   # then open a PR against \$LANE, label it backport-carry"
              echo '```'
            } | gh api repos/"$GITHUB_REPOSITORY"/issues/"$PR_NUMBER"/comments -F body=@-
            exit 0
          fi
          echo "gated=true" >> "$GITHUB_OUTPUT"

      - name: Idempotency — prior carry marker / source moved past its pin
        if: steps.gate.outputs.gated == 'true'
        run: |
          set -euo pipefail
          MARKER="$(gh api repos/"$GITHUB_REPOSITORY"/issues/"$PR_NUMBER"/comments --paginate \
            --jq '.[] | select(.body | contains("<!-- backport-carry-marker")) | .body' | tail -n 1)"
          if [ -n "$MARKER" ]; then
            PIN="$(printf '%s' "$MARKER" | sed -n 's/.*pin:\([0-9a-f]*\).*/\1/p')"
            LIVE_PIN="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
            if [ "$PIN" = "$LIVE_PIN" ]; then
              echo "::notice::already carried at pin $PIN and the source did not move — no-op"
              exit 0
            fi
            echo "::notice::source moved past pin ${PIN:0:8} (now ${LIVE_PIN:0:8}) — rebuilding the existing carry"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.gated == 'true'
        with:
          fetch-depth: 0

      - name: Resolve the current patch lane (bugfix-v<latest tag>)
        id: lane
        if: steps.gate.outputs.gated == 'true'
        run: |
          set -euo pipefail
          LAST="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          [ -n "$LAST" ] || { echo "::error::no v* tags found"; exit 1; }
          LANE="bugfix-v${LAST#v}"
          git fetch -q origin "+refs/heads/$LANE:refs/remotes/origin/$LANE" --tags || true
          if ! git show-ref --verify --quiet "refs/remotes/origin/$LANE"; then
            git checkout -q -B "_cut-$LANE" "refs/tags/$LAST"
            if git push -q origin "HEAD:$LANE"; then
              echo "::notice::cut lane $LANE from tag $LAST (no carried fixes existed yet)"
            else
              echo "::notice::lane $LANE appeared mid-run (another carry cut it) — using it"
              git fetch -q origin "+refs/heads/$LANE:refs/remotes/origin/$LANE"
            fi
          fi
          echo "name=$LANE" >> "$GITHUB_OUTPUT"
          git checkout -q -B "_work" "origin/$LANE"
          echo "patch lane: $LANE @ $(git rev-parse --short HEAD)"

      - name: Cherry-pick the PR's own commits onto a carry branch
        id: pick
        if: steps.gate.outputs.gated == 'true'
        run: |
          set -uo pipefail
          LANE="${{ steps.lane.outputs.name }}"
          CARRY="backport/carry-$PR_NUMBER"
          SRC_SHA="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          SHORT="${SRC_SHA:0:8}"
           # Exact-sha fetch first (works while the source branch still exists);
           # the pull ref survives closed PRs and deleted branches.
           git fetch -q origin "$SRC_SHA" 2>/dev/null \
             || git fetch -q origin "refs/pull/$PR_NUMBER/head" \
             || { echo "::error::cannot fetch head sha $SHORT"; exit 1; }
           [ "$(git rev-parse -q --verify FETCH_HEAD)" = "$SRC_SHA" ] \
             || { echo "::error::fetched object does not match the API head sha $SHORT"; exit 1; }
           # Range = the PR's OWN commits: reachable from its head but absent
           # from CURRENT master — synced-master content can never leak in.
           MB="$(git merge-base origin/master "$SRC_SHA" || true)"
           [ -n "$MB" ] || { echo "::error::no common ancestor between master and $SHORT — refusing to guess a range"; exit 1; }
           SHAS="$(git rev-list --reverse --no-merges "$MB..$SRC_SHA")"
           TOTAL=0; for s in $SHAS; do TOTAL=$((TOTAL+1)); done
           if [ "$TOTAL" -eq 0 ] && [ "$(jq -r '.merged' "$RUNNER_TEMP/pr.json")" = "true" ]; then
             # A real merge-commit merge puts the head ON master, so the own-range
             # above is empty — yet the fix IS on master and label-after-merge must
             # still carry it: fall back to the merge shape itself (the pre-lane
             # bot's proven range; housekeeping merges excluded by --no-merges).
             MC="$(jq -r '.merge_commit_sha // empty' "$RUNNER_TEMP/pr.json")"
             if [ -n "$MC" ] && git rev-parse -q --verify "${MC}^2" >/dev/null 2>&1; then
               SHAS="$(git rev-list --reverse --no-merges "${MC}^1..${MC}^2")"
               TOTAL=0; for s in $SHAS; do TOTAL=$((TOTAL+1)); done
               echo "head already on master (merge-commit merge) — picking its ${TOTAL} commit(s) via ${MC:0:8}^1..^2"
             fi
           fi
          CONFLICTS=""
          CONFLICT_SHAS=""
          i=0
          for sha in $SHAS; do
            i=$((i+1))
            sub="$(git log -1 --format=%s "$sha")"
            if ! err="$(git cherry-pick -x "$sha" 2>&1)"; then
              git cherry-pick --abort
              SHORT_C="$(git rev-parse --short "$sha")"
              CONFLICTS="$CONFLICTS $SHORT_C (${i}/${TOTAL}) ${sub}"
              CONFLICT_SHAS="$CONFLICT_SHAS $SHORT_C"
              echo "::warning::conflict picking ${sha:0:8} ($sub) — recorded, continuing with the rest"
            fi
          done
          {
            echo "total=$TOTAL"
            printf 'conflicts:%s\n' "${CONFLICTS:-none}"
            printf 'conflictshas:%s\n' "${CONFLICT_SHAS# }"
            printf 'shas:%s\n' "$(printf '%s ' "$SHAS" | sed 's/ $//')"
          } > "$RUNNER_TEMP/pick.txt"
          cat "$RUNNER_TEMP/pick.txt"
          APPLIED="$(git log "origin/$LANE..HEAD" --format=%H | wc -l)"
          echo "applied=$APPLIED" >> "$RUNNER_TEMP/pick.txt"
          if [ "$TOTAL" -eq 0 ] || [ "$APPLIED" -eq 0 ]; then
            if [ "$TOTAL" -eq 0 ]; then MSG="no own commits beyond current master"; else MSG="every pick conflicted — nothing clean to push yet"; fi
            {
              echo "(ai: zai/glm-5.3) **backport carry**: $MSG."
              if [ -n "$(printf '%s' "${CONFLICTS:-}" )" ]; then
                echo
                echo "Conflicting picks (resolve manually on a fresh branch off \`$LANE\`):"
                echo '```bash'
                echo "git checkout -b <fix-branch> origin/$LANE"
                printf '%s\n' ${CONFLICT_SHAS# } | while read -r c; do
                  [ -z "$c" ] && continue
                  echo "git cherry-pick -x $c   # resolve the <<<<<<< markers, then continue"
                done
                echo "git push origin HEAD:<fix-branch>   # open a PR against $LANE, label it backport-carry"
                echo '```'
              fi
            } | gh api repos/"$GITHUB_REPOSITORY"/issues/"$PR_NUMBER"/comments -F body=@-
            exit 0
          fi
          git checkout -q -B "$CARRY"
          git push -q -f origin "HEAD:$CARRY" || { echo "::error::pushing $CARRY failed"; exit 1; }
          echo "carried $APPLIED/$TOTAL picks to origin/$CARRY"

      - name: Open / refresh the carry PR
        id: carrypush
        if: steps.gate.outputs.gated == 'true'
        run: |
          set -uo pipefail
          LANE="${{ steps.lane.outputs.name }}"
          CARRY="backport/carry-$PR_NUMBER"
          if ! git rev-parse -q --verify "refs/remotes/origin/$CARRY" >/dev/null; then
            git fetch -q origin "+refs/heads/$CARRY:refs/remotes/origin/$CARRY" || true
          fi
          if ! git rev-parse -q --verify "refs/remotes/origin/$CARRY" >/dev/null; then
            echo "::notice::pick step produced nothing to open (receipt already posted) — skipping"
            exit 0
          fi
          TOTAL="$(sed -n 's/^total=//p' "$RUNNER_TEMP/pick.txt")"
          CONFLICT_LINE="$(sed -n 's/^conflicts://p' "$RUNNER_TEMP/pick.txt")"
          CONFLICT_SHAS="$(sed -n 's/^conflictshas://p' "$RUNNER_TEMP/pick.txt")"
          APPLIED="$(sed -n 's/^applied=//p' "$RUNNER_TEMP/pick.txt")"
          ORIGIN_URL="https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER"
          ORIG_TITLE="$(jq -r '.title' "$RUNNER_TEMP/pr.json")"
          BODY="$( {
            echo "(ai: zai/glm-5.3) Auto-created **carry PR** for source [$ORIGIN_URL]($ORIGIN_URL) (\`$ORIG_TITLE\`)."
            echo
            echo "- Base: \`$LANE\` — the current patch lane, cut from the latest released tag"
            if [ "$APPLIED" != "$TOTAL" ]; then
              echo "- Picks applied cleanly: **$APPLIED of $TOTAL** — ⚠️ the rest CONFLICTED (table below)"
            else
              echo "- Picks applied cleanly: **all $TOTAL** — every commit landed conflict-free"
            fi
            echo "- This PR is a COPY (\`backport-carry\`). Its fixes may land here without ever reaching master — the source PR closes independently."
            echo
            echo "Merge this PR to put the fixes on the lane. To ship them: Actions → *Release (one-click)* → tick **train**."
          } )"
          if [ "$APPLIED" != "$TOTAL" ]; then
            TBL="$( {
              echo
              echo "## ⚠️ Unresolved conflicting picks (resolve INSIDE this PR before merging)"
              echo
              echo "| commit | replay command (after pulling this branch) | subject |"
              echo "|---|---|---|"
              printf '%s\n' "$CONFLICT_SHAS" | while read -r c; do
                [ -z "$c" ] && continue
                subj="$(git log -1 --format=%s "$c" 2>/dev/null || true)"
                echo "| \`$c\` | \`git cherry-pick -x $c\` → fix the <<<<<<< markers | $subj |"
              done
            } )"
            BODY="$BODY$TBL"
          fi
          CREATED="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$LANE" --head "$CARRY" \
            --title "[backport of #$PR_NUMBER] $ORIG_TITLE" --body "$BODY" 2>&1)" || {
            # An open PR with this head already exists (source moved, rebuild path).
            EXISTING="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$CARRY" --state open --json number,url --jq '.[0]' 2>/dev/null)"
            if [ -n "$EXISTING" ]; then
              N="$(printf '%s' "$EXISTING" | jq -r '.number')"
              gh pr edit "$N" --repo "$GITHUB_REPOSITORY" --body "$BODY" >/dev/null
              echo "refreshed existing carry PR #$N"
            else
              echo "::error::gh pr create failed and no open carry PR found:"; printf '%s\n' "$CREATED"
              exit 1
            fi
          }
          CARRY_N="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$CARRY" --state open --json number --jq '.[0].number // empty')"
          [ -n "$CARRY_N" ] || { echo "::error::no open carry PR for $CARRY"; exit 1; }
          gh pr edit "$CARRY_N" --repo "$GITHUB_REPOSITORY" --add-label backport-carry >/dev/null 2>&1 || true
          echo "carry PR #$CARRY_N ready"

      - name: Receipt comment on the source PR
        if: steps.carrypush.outcome == 'success'
        run: |
          set -uo pipefail
          LANE="${{ steps.lane.outputs.name }}"
          CARRY="backport/carry-$PR_NUMBER"
          CARRY_N="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$CARRY" --state open --json number --jq '.[0].number // empty')"
          [ -n "$CARRY_N" ] || exit 0
          TOTAL="$(sed -n 's/^total=//p' "$RUNNER_TEMP/pick.txt")"
          APPLIED="$(sed -n 's/^applied=//p' "$RUNNER_TEMP/pick.txt")"
          CONFLICT_TXT="none — every pick is clean"
          [ "$APPLIED" != "$TOTAL" ] && CONFLICT_TXT="⚠️ $((TOTAL - APPLIED)) of $TOTAL conflict(s) — they are listed INSIDE the carry PR; merge it only after resolving them"
          SRC_PIN="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          {
            echo "<!-- backport-carry-marker pin:$SRC_PIN carry:$CARRY_N -->"
            echo
            echo "(ai: zai/glm-5.3) ✅ **Backport carry created: [#"$CARRY_N"](https://github.com/$GITHUB_REPOSITORY/pull/$CARRY_N)**"
            echo
            echo "- Target: \`$LANE\` (current patch lane, cut from the latest released tag)"
            echo "- Pinned at source head \`${SRC_PIN:0:8}\` — relabel after further edits and the carry rebuilds"
            echo "- Conflicts: $CONFLICT_TXT"
            echo
            echo "Merging the carry PR puts the fixes on the lane. To ship: Actions → *Release (one-click)* → tick **train**. The source PR stays independent — the lane does not need it merged."
          } | gh api repos/"$GITHUB_REPOSITORY"/issues/"$PR_NUMBER"/comments -F body=@-

      - name: Dispatch CI on the carry ref
        if: steps.carrypush.outcome == 'success'
        continue-on-error: true
        run: |
          # GITHUB_TOKEN pushes generate no push event (#772): fire the core
          # matrix on the carry head explicitly so its checks exist before a
          # human merges.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "backport/carry-$PR_NUMBER" \
            && echo "dispatched ci.yml on backport/carry-$PR_NUMBER" \
            || echo "::warning::CI dispatch failed (the next synchronize will re-trigger CI anyway)"
